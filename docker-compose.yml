

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: readylms-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - readylms

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - readylms

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-readylms}
      MYSQL_USER: ${DB_USERNAME:-readylms}
      MYSQL_PASSWORD: ${DB_PASSWORD:-readylms_secret}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-readylms_secret}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - readylms

networks:
  readylms:
    driver: bridge

volumes:
  dbdata:
